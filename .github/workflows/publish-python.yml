name: Publish Python

# Publishes open-banking-io to PyPI via a Trusted Publisher (OIDC) — no token.
# Requires a PyPI trusted publisher for the project (this repo, this workflow, "Production" environment).

on:
  push:
    tags: ['python/v*']
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: Production
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches manifest version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#python/v}"
          MANIFEST_VERSION="$(grep -oE '^version[[:space:]]*=[[:space:]]*"[^"]+"' python/pyproject.toml | head -n1 | sed -E 's/.*"([^"]+)"$/\1/')"
          echo "tag=$TAG_VERSION manifest=$MANIFEST_VERSION"
          [ "$TAG_VERSION" = "$MANIFEST_VERSION" ] || { echo "::error::tag $TAG_VERSION != manifest $MANIFEST_VERSION"; exit 1; }

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install build
      - run: python -m build
        working-directory: python
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist

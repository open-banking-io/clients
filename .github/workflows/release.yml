name: Release

on:
  workflow_dispatch:
    inputs:
      package:
        description: Package to release
        required: true
        type: choice
        options:
          - dotnet
          - node
          - python
          - rust
          - java
          - go
          - ruby
          - php
          - cli
      version:
        description: New version, e.g. 0.2.0 (no leading "v")
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.package }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      PACKAGE: ${{ github.event.inputs.package }}
      VERSION: ${{ github.event.inputs.version }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Validate version
        run: |
          if ! printf '%s' "$VERSION" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'; then
            echo "::error::'$VERSION' is not a valid semver version (e.g. 0.2.0)"
            exit 1
          fi
          echo "TAG=${PACKAGE}/v${VERSION}" >> "$GITHUB_ENV"

      - name: Guard — tag must not already exist
        run: |
          git fetch --tags --quiet
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "::error::tag ${TAG} already exists — bump the version"
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "::error::tag ${TAG} already exists on origin — bump the version"
            exit 1
          fi

      - name: Configure git bot identity
        run: |
          git config user.name  "open-banking-io-bot"
          git config user.email "bot@open-banking.io"

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        if: ${{ env.PACKAGE != 'go' && env.PACKAGE != 'php' && env.PACKAGE != 'cli' }}
        with:
          node-version: 20

      - name: Bump manifest version (all packages except go)
        if: ${{ env.PACKAGE != 'go' && env.PACKAGE != 'php' && env.PACKAGE != 'cli' }}
        run: node tools/bump-version.mjs "$PACKAGE" "$VERSION"

      - name: Commit manifest bump to main
        if: ${{ env.PACKAGE != 'go' && env.PACKAGE != 'php' && env.PACKAGE != 'cli' }}
        run: |
          if git diff --quiet; then
            echo "::error::bump-version made no changes for ${PACKAGE} ${VERSION}"
            exit 1
          fi
          git commit -am "release(${PACKAGE}): v${VERSION}"
          git push origin HEAD:main

      - name: Create and push tag
        run: |
          git tag -a "${TAG}" -m "release(${PACKAGE}): v${VERSION}"
          git push origin "refs/tags/${TAG}"
          echo "::notice::pushed ${TAG} — publish-${PACKAGE}.yml will pick it up"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${TAG}" --title "${PACKAGE} v${VERSION}" --generate-notes --verify-tag

name: Release

on:
  workflow_dispatch:
    inputs:
      package:
        description: Package to release
        required: true
        type: choice
        options:
          - dotnet
          - node
          - n8n
          - python
          - rust
          - java
          - go
          - ruby
          - php
          - cli
      version:
        description: New version, e.g. 0.2.0 (no leading "v")
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.package }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      PACKAGE: ${{ github.event.inputs.package }}
      VERSION: ${{ github.event.inputs.version }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Validate version
        run: |
          if ! printf '%s' "$VERSION" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'; then
            echo "::error::'$VERSION' is not a valid semver version (e.g. 0.2.0)"
            exit 1
          fi
          echo "TAG=${PACKAGE}/v${VERSION}" >> "$GITHUB_ENV"

      - name: Guard — tag must not already exist
        run: |
          git fetch --tags --quiet
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "::error::tag ${TAG} already exists — bump the version"
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "::error::tag ${TAG} already exists on origin — bump the version"
            exit 1
          fi

      - name: Configure git bot identity
        run: |
          git config user.name  "open-banking-io-bot"
          git config user.email "bot@open-banking.io"

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        if: ${{ env.PACKAGE != 'go' && env.PACKAGE != 'php' && env.PACKAGE != 'cli' }}
        with:
          node-version: 20

      - name: Verify the manifest is already at the target version
        if: ${{ env.PACKAGE != 'go' && env.PACKAGE != 'php' && env.PACKAGE != 'cli' }}
        run: |
          node tools/bump-version.mjs "$PACKAGE" "$VERSION"
          if ! git diff --quiet; then
            echo "::error::${PACKAGE} manifest is not at ${VERSION} — bump it via a PR and merge to main before releasing"
            git checkout -- .
            exit 1
          fi

      - name: Create and push tag
        env:
          RELEASE_TOKEN: ${{ secrets.MIRROR_PUSH_TOKEN }}
        run: |
          git tag -a "${TAG}" -m "release(${PACKAGE}): v${VERSION}"
          git push "https://x-access-token:${RELEASE_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "refs/tags/${TAG}"
          echo "::notice::pushed ${TAG} via PAT — publish-${PACKAGE}.yml will trigger"

      - name: Create GitHub Release
        # The cli package's publish-cli.yml owns its release (it attaches the built binaries), so
        # don't create an empty one here that would collide with it.
        if: ${{ env.PACKAGE != 'cli' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${TAG}" --title "${PACKAGE} v${VERSION}" --generate-notes --verify-tag

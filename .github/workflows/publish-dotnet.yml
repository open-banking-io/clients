name: Publish .NET

# Publishes OpenBankingIO.Client to NuGet via Trusted Publishing (OIDC) — no API key secret.
# Requires a NuGet Trusted Publishing policy for this package, repo, and the "Production" environment.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: Production
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - run: dotnet pack dotnet/src/OpenBankingIO.Client -c Release -o out

      - name: Authenticate to NuGet (trusted publishing)
        uses: NuGet/login@v1
        id: login
        with:
          user: softwarehuset

      - name: Push
        run: dotnet nuget push "out/*.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate

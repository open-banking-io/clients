name: Publish Node

# Publishes @open-banking-io/client to npm via OIDC trusted publishing (+ provenance) — no token.
# Requires a trusted publisher configured for the package on npmjs.com (this repo, this workflow).

on:
  push:
    tags: ['node/v*']
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: Production
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: node
    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches manifest version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#node/v}"
          MANIFEST_VERSION="$(grep -oE '"version"[[:space:]]*:[[:space:]]*"[^"]+"' package.json | head -n1 | sed -E 's/.*"([^"]+)"$/\1/')"
          echo "tag=$TAG_VERSION manifest=$MANIFEST_VERSION"
          [ "$TAG_VERSION" = "$MANIFEST_VERSION" ] || { echo "::error::tag $TAG_VERSION != manifest $MANIFEST_VERSION"; exit 1; }

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run build
      - run: npm install -g npm@latest   # OIDC trusted publishing needs npm >= 11.5
      # Token-less: uses OIDC trusted publishing (configured on npmjs.com) + provenance.
      - run: npm publish --provenance --access public

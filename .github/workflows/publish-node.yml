name: Publish Node

# Publishes @open-banking-io/client to npm via OIDC trusted publishing (+ provenance) — no token.
# Requires a trusted publisher configured for the package on npmjs.com (this repo, this workflow).

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: Production
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: node
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest   # npm >= 11.5 supports OIDC trusted publishing
      - run: npm ci
      - run: npm run build
      - run: npm publish --provenance --access public

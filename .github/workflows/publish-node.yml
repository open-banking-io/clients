name: Publish Node

on:
  push:
    tags: ['node/v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: Production
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: node
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Verify tag matches manifest version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#node/v}"
          MANIFEST_VERSION="$(grep -oE '"version"[[:space:]]*:[[:space:]]*"[^"]+"' package.json | head -n1 | sed -E 's/.*"([^"]+)"$/\1/')"
          echo "tag=$TAG_VERSION manifest=$MANIFEST_VERSION"
          [ "$TAG_VERSION" = "$MANIFEST_VERSION" ] || { echo "::error::tag $TAG_VERSION != manifest $MANIFEST_VERSION"; exit 1; }

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run build
      # OIDC Trusted Publishing (the token-less publish auth) requires npm >= 11.5.1.
      # Node 22 bundles npm 10.9.x, which signs --provenance fine but CANNOT perform the
      # trusted-publishing OIDC token exchange, so the registry PUT is sent unauthenticated
      # and the registry returns 404 (it masks 403 as 404). Pin an exact npm version — not
      # `npm@latest` — to satisfy dependency pinning while meeting the >= 11.5.1 floor.
      - run: npm install -g npm@11.5.1
      - run: npm publish --provenance --access public

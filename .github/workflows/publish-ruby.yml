name: Publish Ruby

on:
  push:
    tags: ['ruby/v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: Production
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: ruby
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
          working-directory: ruby

      - run: bundle exec rspec

      - name: Verify the gem version matches the tag
        if: startsWith(github.ref, 'refs/tags/ruby/v')
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#ruby/v}"
          GEM_VERSION="$(ruby -Ilib -r open_banking_io/version -e 'print OpenBankingIO::VERSION')"
          echo "tag=$TAG_VERSION gem=$GEM_VERSION"
          [ "$TAG_VERSION" = "$GEM_VERSION" ] || { echo "::error::tag $TAG_VERSION != gem $GEM_VERSION"; exit 1; }

      - name: Configure RubyGems credentials (OIDC trusted publishing)
        uses: rubygems/configure-rubygems-credentials@17e51a8c9fcf6d5f709e04cc612fd105f9273170 # main

      - run: gem build open-banking-io.gemspec
      - run: gem push open-banking-io-*.gem

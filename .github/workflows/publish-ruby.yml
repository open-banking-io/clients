name: Publish Ruby

on:
  push:
    tags: ['ruby/v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: Production
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: ruby
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: ruby/setup-ruby@89f90524b88a01fe6e0b732220432cc6142926af # v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
          working-directory: ruby

      - run: bundle exec rspec

      - name: Verify the gem version matches the tag
        if: startsWith(github.ref, 'refs/tags/ruby/v')
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#ruby/v}"
          GEM_VERSION="$(ruby -Ilib -r open_banking_io/version -e 'print OpenBankingIO::VERSION')"
          echo "tag=$TAG_VERSION gem=$GEM_VERSION"
          [ "$TAG_VERSION" = "$GEM_VERSION" ] || { echo "::error::tag $TAG_VERSION != gem $GEM_VERSION"; exit 1; }

      - name: Configure RubyGems credentials (OIDC trusted publishing)
        uses: rubygems/configure-rubygems-credentials@1bdb26389d20bf86acb5704abb84b4e401ecb8e2 # main

      - run: gem build open-banking-io.gemspec
      - run: gem push open-banking-io-*.gem

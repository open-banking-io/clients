name: Publish Ruby

on:
  push:
    tags: ['ruby/v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: Production
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: ruby
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ruby/setup-ruby@d45b1a4e94b71acab930e56e79c6aa188764e7f9 # v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
          working-directory: ruby

      - run: bundle exec rspec

      - name: Verify the gem version matches the tag
        if: startsWith(github.ref, 'refs/tags/ruby/v')
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#ruby/v}"
          GEM_VERSION="$(ruby -Ilib -r open_banking_io/version -e 'print OpenBankingIO::VERSION')"
          echo "tag=$TAG_VERSION gem=$GEM_VERSION"
          [ "$TAG_VERSION" = "$GEM_VERSION" ] || { echo "::error::tag $TAG_VERSION != gem $GEM_VERSION"; exit 1; }

      - name: Configure RubyGems credentials (OIDC trusted publishing)
        uses: rubygems/configure-rubygems-credentials@6861877652452567c1a007a50badad3d316fc9ba # main

      - run: gem build open-banking-io.gemspec
      - run: gem push open-banking-io-*.gem

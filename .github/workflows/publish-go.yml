name: Publish Go

on:
  push:
    tags: ['go/v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25'
      - run: go test ./...
      - name: Warm the module proxy
        run: |
          VERSION="${GITHUB_REF_NAME#go/}"
          curl -fsSL "https://proxy.golang.org/github.com/open-banking-io/clients/go/@v/${VERSION}.info" || true

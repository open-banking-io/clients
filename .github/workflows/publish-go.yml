name: Publish Go

on:
  push:
    tags: ['go/v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.25'
      - run: go test ./...
      - name: Warm the module proxy
        run: |
          VERSION="${GITHUB_REF_NAME#go/}"
          curl -fsSL "https://proxy.golang.org/github.com/open-banking-io/clients/go/@v/${VERSION}.info" || true

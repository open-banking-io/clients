name: Publish Go

on:
  push:
    tags: ['go/v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.25'
      - run: go test ./...
      - name: Warm the module proxy
        run: |
          VERSION="${GITHUB_REF_NAME#go/}"
          curl -fsSL "https://proxy.golang.org/github.com/open-banking-io/clients/go/@v/${VERSION}.info" || true

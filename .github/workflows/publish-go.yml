name: Publish Go

on:
  push:
    tags: ['go/v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: '1.25'
      - run: go test ./...
      - name: Warm the module proxy
        run: |
          VERSION="${GITHUB_REF_NAME#go/}"
          curl -fsSL "https://proxy.golang.org/github.com/open-banking-io/clients/go/@v/${VERSION}.info" || true

name: Publish PHP

# Packagist requires composer.json at a repo root, but ours lives in php/ (a monorepo subdir).
# On a `php/vX.Y.Z` tag we run the tests, then git-subtree-split php/ into the read-only mirror
# repo open-banking-io/client-php (tagged vX.Y.Z), which Packagist watches and publishes.
#
# Requires a MIRROR_PUSH_TOKEN secret: a PAT (or fine-grained token) with contents:write on
# open-banking-io/client-php (the default GITHUB_TOKEN can't push to a different repo).

on:
  push:
    tags: ['php/v*']
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: php
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: openssl, curl, json
          tools: composer:v2
      - run: composer validate --strict --no-check-version
      - run: composer install --prefer-dist --no-interaction --no-progress
      - run: vendor/bin/phpunit

  mirror:
    # Split php/ into the Packagist mirror with the version tag (strip the `php/` prefix).
    needs: test
    if: startsWith(github.ref, 'refs/tags/php/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Don't persist the github-actions[bot] credential — it sets an http.extraheader
          # that would override our inline MIRROR_TOKEN and 403 on the other repo.
          persist-credentials: false

      - name: Compute mirror tag
        run: echo "MIRROR_TAG=${GITHUB_REF_NAME#php/}" >> "$GITHUB_ENV"

      - name: Subtree-split php/ and push to the Packagist mirror
        env:
          MIRROR_TOKEN: ${{ secrets.MIRROR_PUSH_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name  "open-banking-io-bot"
          git config user.email "bot@open-banking.io"
          # Split php/ into a single commit history containing only its contents.
          SPLIT_SHA="$(git subtree split --prefix=php)"
          echo "split sha: $SPLIT_SHA"
          # x-access-token:<token>@ is the reliable HTTPS auth form (token as password).
          REMOTE="https://x-access-token:${MIRROR_TOKEN}@github.com/open-banking-io/client-php.git"
          git push --force "$REMOTE" "${SPLIT_SHA}:refs/heads/main"
          git tag -f "${MIRROR_TAG}" "${SPLIT_SHA}"
          git push --force "$REMOTE" "refs/tags/${MIRROR_TAG}"

      - name: Verify the mirror received the tag
        # The split action logs push failures but still exits 0 — assert the tag really landed.
        run: |
          for i in $(seq 1 10); do
            code=$(curl -sS -o /dev/null -w '%{http_code}' \
              "https://api.github.com/repos/open-banking-io/client-php/git/refs/tags/${MIRROR_TAG}")
            if [ "$code" = "200" ]; then echo "mirror tag ${MIRROR_TAG} present ✓"; exit 0; fi
            echo "waiting for mirror tag ${MIRROR_TAG} (got $code)..."; sleep 3
          done
          echo "::error::mirror tag ${MIRROR_TAG} not found on open-banking-io/client-php — the subtree-split push failed (check MIRROR_PUSH_TOKEN)"
          exit 1

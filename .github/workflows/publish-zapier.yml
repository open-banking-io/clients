name: Publish Zapier

# Source of truth is this monorepo (zapier/). On a zapier/v* tag we test the package,
# then subtree-split zapier/ and force-push it (plus a v* tag) to the open-banking-io/zapier
# mirror, where the app sits at the repo root. The mirror's own publish.yml then deploys
# to Zapier — see zapier/.github/workflows/publish.yml. This keeps development in the
# monorepo while giving Zapier a clean root-level repo that the deploy points at.

on:
  push:
    tags: ['zapier/v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-zapier-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22, 24]
    defaults:
      run:
        working-directory: zapier
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci
      - run: npm test
      # Fail BEFORE the mirror force-push if the tag doesn't match package.json —
      # the mirror's own check runs too late to prevent a bad mirror update.
      - name: Verify tag matches manifest version
        if: startsWith(github.ref, 'refs/tags/zapier/v')
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#zapier/v}"
          MANIFEST_VERSION="$(node -p "require('./package.json').version")"
          echo "tag=$TAG_VERSION manifest=$MANIFEST_VERSION"
          [ "$TAG_VERSION" = "$MANIFEST_VERSION" ] || { echo "::error::tag $TAG_VERSION != manifest $MANIFEST_VERSION"; exit 1; }

  mirror:
    needs: test
    if: startsWith(github.ref, 'refs/tags/zapier/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Compute mirror tag
        run: echo "MIRROR_TAG=${GITHUB_REF_NAME#zapier/}" >> "$GITHUB_ENV"

      - name: Subtree-split zapier/ and push to the open-banking-io/zapier mirror
        env:
          MIRROR_TOKEN: ${{ secrets.MIRROR_PUSH_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name  "open-banking-io-bot"
          git config user.email "bot@open-banking.io"
          SPLIT_SHA="$(git subtree split --prefix=zapier)"
          echo "split sha: $SPLIT_SHA"
          REMOTE="https://x-access-token:${MIRROR_TOKEN}@github.com/open-banking-io/zapier.git"
          git push --force "$REMOTE" "${SPLIT_SHA}:refs/heads/main"
          git tag -f "${MIRROR_TAG}" "${SPLIT_SHA}"
          git push --force "$REMOTE" "refs/tags/${MIRROR_TAG}"

      - name: Verify the mirror received the tag
        env:
          MIRROR_TOKEN: ${{ secrets.MIRROR_PUSH_TOKEN }}
        # Authenticated git ls-remote — the anonymous REST API rate-limits
        # shared runner IPs and can't see a private mirror.
        run: |
          REMOTE="https://x-access-token:${MIRROR_TOKEN}@github.com/open-banking-io/zapier.git"
          for i in $(seq 1 10); do
            if git ls-remote --exit-code "$REMOTE" "refs/tags/${MIRROR_TAG}" > /dev/null; then
              echo "mirror tag ${MIRROR_TAG} present ✓"; exit 0
            fi
            echo "waiting for mirror tag ${MIRROR_TAG}..."; sleep 3
          done
          echo "::error::mirror tag ${MIRROR_TAG} not found on open-banking-io/zapier — the subtree-split push failed (check MIRROR_PUSH_TOKEN)"
          exit 1

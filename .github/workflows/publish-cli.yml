name: Publish CLI

on:
  push:
    tags: ['cli/v*']
  pull_request:
    paths:
      - 'cli/**'
      - '.github/workflows/publish-cli.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  # Build in module mode against the published SDK (clients/go), not the local go.work copy, so the
  # binaries match what `go install ...@latest` produces.
  GOWORK: "off"

jobs:
  # Cross-compiles all targets. On a cli/vX.Y.Z tag it also publishes the GitHub Release and updates
  # the Homebrew tap. On PRs it just builds (snapshot) to validate the matrix without publishing.
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # keyless cosign signing of release artifacts via Sigstore OIDC
      attestations: write # SLSA build provenance for the release binaries
    env:
      # The brew step is skipped until the tap repo + token exist, so the first release can still
      # ship binaries before the tap is set up.
      HAS_TAP: ${{ secrets.HOMEBREW_TAP_TOKEN != '' }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.25'

      - name: Determine version
        id: ver
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/cli/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/cli/v}" >> "$GITHUB_OUTPUT"
            echo "is_tag=true" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-snapshot.${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
            echo "is_tag=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build all platforms
        working-directory: cli
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          targets="linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64"
          for t in $targets; do
            os="${t%/*}"; arch="${t#*/}"
            bin=openbanking; [ "$os" = windows ] && bin=openbanking.exe
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" -o "$bin" .
            name="openbanking_${VERSION}_${os}_${arch}"
            if [ "$os" = windows ]; then zip -j "dist/${name}.zip" "$bin"; else tar -czf "dist/${name}.tar.gz" "$bin"; fi
            rm -f "$bin"
          done
          ( cd dist && sha256sum * > checksums.txt )
          echo "Built:"; ls -1 dist

      - name: Install cosign
        if: steps.ver.outputs.is_tag == 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign checksums (keyless)
        if: steps.ver.outputs.is_tag == 'true'
        working-directory: cli/dist
        run: |
          # Keyless Sigstore signature over checksums.txt. Since every artifact's SHA-256 is
          # listed there, one signature transitively covers all binaries. The .sig + .pem land
          # in dist/ and get uploaded alongside the binaries by the release step below.
          # Verify with:
          #   cosign verify-blob --certificate checksums.txt.pem --signature checksums.txt.sig \
          #     --certificate-identity-regexp 'https://github.com/open-banking-io/clients/.*' \
          #     --certificate-oidc-issuer https://token.actions.githubusercontent.com checksums.txt
          cosign sign-blob --yes \
            --output-signature checksums.txt.sig \
            --output-certificate checksums.txt.pem \
            checksums.txt

      - name: Attest build provenance
        if: steps.ver.outputs.is_tag == 'true'
        id: attest
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: |
            cli/dist/*.tar.gz
            cli/dist/*.zip

      - name: Attach provenance bundle to the release assets
        if: steps.ver.outputs.is_tag == 'true'
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          # Ship the SLSA provenance next to the binaries (as *.intoto.jsonl) so the signature
          # AND its provenance are both discoverable on the GitHub Release. Verify with:
          #   gh attestation verify openbanking_${VERSION}_<os>_<arch>.tar.gz --repo open-banking-io/clients
          cp "$BUNDLE" "cli/dist/openbanking_${VERSION}.intoto.jsonl"

      - name: Publish GitHub Release with binaries
        if: steps.ver.outputs.is_tag == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          notes="Binaries for linux/macOS/windows (amd64 + arm64). Verify with checksums.txt. Install via Homebrew: \`brew install open-banking-io/tap/openbanking\`."
          # Idempotent: create the release if it doesn't exist yet, otherwise attach the assets to it
          # (handles re-runs and any pre-created release).
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" cli/dist/* --clobber
          else
            gh release create "${GITHUB_REF_NAME}" cli/dist/* --title "open-banking.io CLI ${VERSION}" --notes "$notes"
          fi

      - name: Update Homebrew tap
        if: steps.ver.outputs.is_tag == 'true' && env.HAS_TAP == 'true'
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          cd cli/dist
          sha() { grep "  openbanking_${VERSION}_$1\$" checksums.txt | awk '{print $1}'; }
          dl="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
          cat > openbanking.rb <<EOF
          # typed: false
          # frozen_string_literal: true
          class Openbanking < Formula
            desc "open-banking.io command line — read, sync and connect your bank data locally"
            homepage "https://open-banking.io"
            version "${VERSION}"
            license "MIT"

            on_macos do
              on_arm do
                url "${dl}/openbanking_${VERSION}_darwin_arm64.tar.gz"
                sha256 "$(sha darwin_arm64.tar.gz)"
              end
              on_intel do
                url "${dl}/openbanking_${VERSION}_darwin_amd64.tar.gz"
                sha256 "$(sha darwin_amd64.tar.gz)"
              end
            end

            on_linux do
              on_arm do
                url "${dl}/openbanking_${VERSION}_linux_arm64.tar.gz"
                sha256 "$(sha linux_arm64.tar.gz)"
              end
              on_intel do
                url "${dl}/openbanking_${VERSION}_linux_amd64.tar.gz"
                sha256 "$(sha linux_amd64.tar.gz)"
              end
            end

            def install
              bin.install "openbanking"
            end

            test do
              system "#{bin}/openbanking", "version"
            end
          end
          EOF
          git clone --depth 1 "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/open-banking-io/homebrew-tap.git" tap
          mkdir -p tap/Formula
          rm -f tap/Formula/*.rb
          cp openbanking.rb tap/Formula/openbanking.rb
          cd tap
          git config user.name  "open-banking-io-bot"
          git config user.email "bot@open-banking.io"
          git add -A Formula/
          git commit -m "open-banking.io CLI ${VERSION}"
          git push

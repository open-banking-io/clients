name: Publish Java

# Publishes io.openbanking:open-banking-io-client to Maven Central (Sonatype Central Portal) on a v* tag.
# Add these secrets to enable it:
#   MAVEN_CENTRAL_USERNAME / MAVEN_CENTRAL_PASSWORD  — a Central Portal user token
#   MAVEN_GPG_PRIVATE_KEY / MAVEN_GPG_PASSPHRASE     — an ASCII-armored signing key + its passphrase

on:
  push:
    tags: ['java/v*']
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: Production
    defaults:
      run:
        working-directory: java
    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches manifest version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#java/v}"
          MANIFEST_VERSION="$(grep -oE '<version>[^<]+</version>' pom.xml | head -n1 | sed -E 's/<\/?version>//g')"
          echo "tag=$TAG_VERSION manifest=$MANIFEST_VERSION"
          [ "$TAG_VERSION" = "$MANIFEST_VERSION" ] || { echo "::error::tag $TAG_VERSION != manifest $MANIFEST_VERSION"; exit 1; }

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          server-id: central
          server-username: MAVEN_CENTRAL_USERNAME
          server-password: MAVEN_CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE
      - run: mvn -B -P release deploy
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}

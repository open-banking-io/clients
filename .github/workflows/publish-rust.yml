name: Publish Rust

# Publishes open-banking-io to crates.io on a v* tag via crates.io Trusted Publishing (OIDC).
#
# A Trusted Publisher can only be configured for a crate that already exists, so the FIRST publish
# uses the CARGO_REGISTRY_TOKEN secret (a crates.io API token). After it succeeds:
#   1. on crates.io → the crate's Settings → Trusted Publishing, add GitHub repo
#      `open-banking-io/clients`, workflow `publish-rust.yml`, environment `Production`;
#   2. delete (revoke) the CARGO_REGISTRY_TOKEN — subsequent publishes authenticate via OIDC.

on:
  push:
    tags: ['rust/v*']
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: Production
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches manifest version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#rust/v}"
          MANIFEST_VERSION="$(grep -oE '^version[[:space:]]*=[[:space:]]*"[^"]+"' Cargo.toml | head -n1 | sed -E 's/.*"([^"]+)"$/\1/')"
          echo "tag=$TAG_VERSION manifest=$MANIFEST_VERSION"
          [ "$TAG_VERSION" = "$MANIFEST_VERSION" ] || { echo "::error::tag $TAG_VERSION != manifest $MANIFEST_VERSION"; exit 1; }

      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test

      # Mint a short-lived token via OIDC. No-ops until a Trusted Publisher is configured, so the
      # step is allowed to fail and we fall back to CARGO_REGISTRY_TOKEN for the first publish.
      - name: Authenticate to crates.io (trusted publishing)
        id: auth
        uses: rust-lang/crates-io-auth-action@v1
        continue-on-error: true

      - name: Publish
        run: cargo publish --token "$CARGO_REGISTRY_TOKEN"
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token || secrets.CARGO_REGISTRY_TOKEN }}

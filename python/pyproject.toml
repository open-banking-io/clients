[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "open-banking-io"
version = "1.0.0"
description = "Server-to-server client for open-banking.io with local zero-knowledge envelope decryption."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "open-banking.io" }]
keywords = ["open-banking", "psd2", "banking", "zero-knowledge", "ecdh"]
dependencies = [
    "cryptography>=49.0",
    "httpx>=0.28",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0",
    "pytest-httpserver>=1.1",
    "pytest-cov>=7.0",
    "ruff>=0.15",
    "mypy>=2.0",
]

[project.urls]
Homepage = "https://open-banking.io"
Repository = "https://github.com/open-banking-io/clients"

[tool.hatch.build.targets.wheel]
packages = ["src/open_banking_io"]

[tool.coverage.run]
branch = true
source = ["open_banking_io"]

[tool.coverage.report]
show_missing = true

[tool.coverage.xml]
output = "coverage.xml"

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B017"]  # allow `pytest.raises(Exception)` in negative tests

[tool.mypy]
python_version = "3.10"
files = ["src"]
strict = true
warn_unreachable = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
